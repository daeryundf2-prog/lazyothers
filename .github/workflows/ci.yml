name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Korean font (so stamp tests run instead of skipping)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: Run pytest
        shell: bash
        run: |
          pytest -q --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # 실패 테스트를 check-run 어노테이션으로 노출 (로그 열람 없이 원인 파악용)
          grep -E "^(FAILED|ERROR)" pytest.log | head -20 | while read -r line; do
            echo "::error::${line}"
          done
          exit $status

      - name: Encoding smoke (non-UTF-8 locale, Windows만)
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: "0"
        run: |
          pytest -q tests/test_contracts_vendored.py tests/test_mcp_scaffold.py tests/test_parse_korean_doc.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate MCP config (sync script)
        run: node scripts/sync-mcp.mjs

      - name: Validate JSON files
        shell: bash
        run: |
          python - << 'PY'
          import json, glob
          for f in ["plugin.json", "package.json", "mcp_config.json"] + glob.glob("mcp/**/*.json", recursive=True):
              json.load(open(f, encoding="utf-8"))
              print("OK", f)
          PY
