name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Korean font (so stamp tests run instead of skipping)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: Run pytest
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate MCP config (sync script)
        run: node scripts/sync-mcp.mjs

      - name: Validate JSON files
        run: |
          python - << 'PY'
          import json, glob
          for f in ["plugin.json", "package.json", "mcp_config.json"] + glob.glob("mcp/**/*.json", recursive=True):
              json.load(open(f, encoding="utf-8"))
              print("OK", f)
          PY
